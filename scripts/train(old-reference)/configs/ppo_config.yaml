# environment
motion_path: "data/lafan1_retargeted/g1/walk1_subject1.csv"

# network
hidden_dim: 512
action_scale: 0.15
reset_joint_noise: 0.0
reset_vel_noise: 0.0
term_height_threshold: 0.55
term_orientation_threshold: 1.8
init_log_std: -2.0

# ppo
lr: 0.00005
gamma: 0.997
gae_lambda: 0.95
clip_range: 0.2
n_epochs: 4
batch_size: 2048
rollout_steps: 8192
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
total_steps: 30000000
n_envs: 16
lr_anneal: true
seed: 42
target_kl: 0.015
vector_env_type: "async"
vector_env_context: "spawn"
torch_num_threads: 1

# logging
log_freq: 8192
save_freq: 1000000
