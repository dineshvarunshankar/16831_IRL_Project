# Environment
motion_path: "data/lafan1_retargeted/g1/walk1_subject1.csv"

# Network
hidden_dims: [512, 256, 128]
activation: "elu"

# PPO
lr: 0.00007
gamma: 0.995
gae_lambda: 0.97
clip_range: 0.2
n_epochs: 6
batch_size: 2048
rollout_steps: 8192
ent_coef: 0.0003
vf_coef: 1.0
max_grad_norm: 1.0
total_steps: 30000000

# Parallelization
n_envs: 16
vector_env_type: "async"
vector_env_context: "spawn"
seed: 42
torch_num_threads: 1
torch_num_interop_threads: 1

# Motion processing / observation
future_offsets: [0, 1, 2, 4, 8]
smoothing_window: 5
obs_clip: 10.0

# Control
action_scale: 0.03
init_log_std: -2.5
mean_scale: 0.5

# Episode / curriculum (random reset from start + competence thresholds)
episode_length: 1000
reset_phase_start: 0.0
reset_phase_end: 1.0
curriculum_mode: "competence"
final_reset_phase_end: 1.0
curriculum_update_freq: 100000
competence_ema_alpha: 0.98
competence_low: 0.10
competence_high: 0.80
adaptive_reset_enabled: true
adaptive_reset_bins: 80
adaptive_reset_warmup_episodes: 2000
adaptive_reset_uniform_mix: 0.5
adaptive_reset_smoothing: 9
adaptive_reset_power: 1.2
adaptive_reset_min_visits: 5.0
reset_joint_noise: 0.01
reset_vel_noise: 0.05
initial_height_threshold: 1.0
height_threshold: 0.75
initial_ori_threshold: 2.4
ori_threshold: 2.0
min_root_height: 0.30

# Contact heuristic
contact_height_threshold: 0.06
contact_vel_threshold: 0.35

# Reward
pose_reward_weight: 0.45
vel_reward_weight: 0.10
root_reward_weight: 0.45
root_vel_reward_weight: 0.25
eff_reward_weight: 0.10
contact_reward_weight: 0.05
pose_sigma: 0.35
vel_sigma: 2.0
root_sigma: 0.35
root_vel_sigma: 0.8
eff_sigma: 0.10
action_rate_weight: 0.005
joint_limit_weight: 2.0
residual_reg_coef: 0.0002
target_kl: 0.01
eval_deterministic_default: true

# Logging
log_freq: 1000
save_freq: 200000
