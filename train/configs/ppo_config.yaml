# Environment
motion_path: "data/lafan1_retargeted/g1/walk1_subject1.csv"

# Network
hidden_dims: [512, 256, 128]
activation: "elu"

# PPO
lr: 0.0003
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
n_epochs: 5
batch_size: 2048
rollout_steps: 4096
ent_coef: 0.0
vf_coef: 1.0
max_grad_norm: 1.0
total_steps: 20000000

# Parallelization
n_envs: 8

# Logging
log_freq: 1000
save_freq: 100000
