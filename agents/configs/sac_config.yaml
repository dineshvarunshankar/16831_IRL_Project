motion_path: "data/lafan1_retargeted_npz/g1/walk1_subject1.npz"

device: "cuda:0"
seed: 42
wandb_project: "locomimic"

actor_hidden_dim: [256, 256]
critic_hidden_dim: [256, 256]

lr: 0.0003
weight_decay: 0.001
gamma: 0.97 # was 0.99
tau: 0.005 # was 0.125 for sac_vanilla
batch_size: 4096
buffer_size: 1024  # per-env; total capacity = buffer_size * num_envs
num_learning_iterations: 25000
learning_starts: 10
gradient_steps: 8
policy_frequency: 4   # TD3-style delayed actor: actor+alpha updated every N critic updates

# entropy / alpha
alpha_init: 0.001 #need to tune this - was 0.1 for sac_vanilla
target_entropy_ratio: 0.5  # target_entropy = -act_dim * ratio

# actor log_std clamp
log_std_min: -20
log_std_max: 0.0

# logging
log_freq: 100
ep_stats_window: 100
ckpt_fractions: [0.25, 0.50, 0.75]

use_layer_norm: false
use_mean_q: false
