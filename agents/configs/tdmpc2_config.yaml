# TD-MPC2 single-task config for Unitree motion imitation.

# Environment/task.
motion_path: "/home/dtc/dinesh_varun/16831/project/16831_IRL_Project/unitree_rl_mjlab/src/assets/motions/g1/walk1_subject1.npz"
task: "Unitree-G1-Tracking"
num_envs: 512
seed: 42
device: "cuda"

# Training loop.
total_steps: 10000000
step_unit: "env_frames"
log_freq: 1000
save_freq: 50000
eval_freq: 100000
eval_episodes: 5

# Optimizer.
lr: 0.0003
encoder_lr: 0.0001
grad_clip_norm: 20.0

# Replay and update schedule.
buffer_size: 1000000
batch_size: 256
seed_steps_floor: 1000
seed_steps: 2500
updates_per_collect: 16

# RL settings.
gamma: 0.99
temporal_coef: 0.5
tau: 0.01
episodic: true

# Loss weights.
consistency_coef: 20.0
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1.0
entropy_coef: 0.0001

# Architecture.
encoder_dim: 256
mlp_dim: 512
latent_dim: 512
simnorm_dim: 8
simnorm_temp: 1.0
num_q: 5
q_dropout: 0.01
num_bins: 101
value_support: 10.0
log_std_min: -10.0
log_std_max: 2.0

# Planner (MPPI in latent space).
horizon: 5
mpc_iterations: 6
mpc_action_dim_iters_threshold: 20
mpc_action_dim_extra_iterations: 2
mpc_samples: 512
mpc_elites: 64
mpc_policy_samples: 24
mpc_min_std: 0.05
mpc_max_std: 2.0
mpc_temperature: 0.5

# Hybrid acting for massive parallel env rollout.
use_hybrid_acting: true
mpc_train_envs: 128
mpc_eval: true

# Actor observation splicing.
exogenous_terms:
  - "command"
  - "motion_anchor_pos_b"
  - "motion_anchor_ori_b"

# Logging.
wandb_project: "locomimic"
wandb_entity: null
use_wandb: true
